<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <title>Flight Board</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="patapata.css"
  >


  <style>

    .col-schedule {
      width: 11%;
    }

    .col-estimated {
      width: 11%;
    }

    .col-destination {
      width: 25%;
    }

    .col-flight {
      width: 27%;
    }

    .col-aircraft {
      width: 10%;
      text-align: center;
      font-weight: 700;
    }

    .col-terminal {
      width: 8%;
    }

    .col-gate {
      width: 8%;
    }

    .aircraft-code {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }


    @media
    (orientation: landscape)
    and (pointer: coarse) {

      .col-schedule {
        width: 11%;
      }

      .col-estimated {
        width: 11%;
      }

      .col-destination {
        width: 25%;
      }

      .col-flight {
        width: 27%;
      }

      .col-aircraft {
        width: 10%;
      }

      .col-terminal {
        width: 8%;
      }

      .col-gate {
        width: 8%;
      }

      .aircraft-code {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


  <div class="board-container">


    <div class="header">


      <div class="header-icon">

        <svg
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >

          <path
            d="M2.5 19h19v2h-19zm19.57-7.36c-.21-.8-1.04-1.28-1.84-1.06L14.92 12l-4.32-8.31-2.48.66 3.1 7.23-4.8 1.28-1.61-2.22-1.93.51 2.37 3.55 13.88-3.7c.8-.21 1.28-1.04 1.07-1.84z"
          >
          </path>

        </svg>

      </div>


      <div class="header-text">

        <span
          class="en"
          id="header-en"
        >
          Departures
        </span>

        <span
          class="ja"
          id="header-ja"
        >
          出発
        </span>

      </div>


      <div class="settings-menu">


        <select
          id="display-select"
          aria-label="表示方式"
        >

          <option value="normal">
            通常
          </option>

          <option value="split">
            パタパタ
          </option>

        </select>


        <select
          id="direction-select"
          aria-label="出発到着"
        >

          <option value="departures">
            出発
          </option>

          <option value="arrivals">
            到着
          </option>

        </select>


        <select
          id="filter-select"
          aria-label="路線種別"
        >

          <option value="all">
            すべて
          </option>

          <option value="domestic">
            国内線
          </option>

          <option value="international">
            国際線
          </option>

        </select>


        <select
          id="airport-select"
          aria-label="空港選択"
        >

          <option value="HND">
            羽田 (HND)
          </option>

          <option value="ITM">
            伊丹 (ITM)
          </option>

          <option value="FUK">
            福岡 (FUK)
          </option>

          <option value="NRT">
            成田 (NRT)
          </option>

        </select>


        <svg
          class="settings-icon"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >

          <path
            d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87c-0.11,0.21-0.07,0.47,0.13,0.61l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94zM12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"
          >
          </path>

        </svg>


      </div>

    </div>


    <div class="table-header">


      <div class="col-schedule">

        Schedule

        <br>

        <span id="schedule-ja">
          出発時刻
        </span>

      </div>


      <div class="col-estimated">

        Estimated

        <br>

        <span>
          変更時刻
        </span>

      </div>


      <div class="col-destination">

        <span id="location-en">
          Destination
        </span>

        <br>

        <span id="location-ja">
          行先
        </span>

      </div>


      <div class="col-flight">

        Flight

        <br>

        <span>
          便名
        </span>

      </div>


      <div class="col-aircraft">

        Aircraft

        <br>

        <span>
          機種
        </span>

      </div>


      <div class="col-terminal">

        Terminal

        <br>

        <span>
          ターミナル
        </span>

      </div>


      <div class="col-gate">

        Gate

        <br>

        <span>
          ゲート
        </span>

      </div>


    </div>


    <div class="table-border"></div>


    <div
      class="flight-list"
      id="flight-list"
    >

      <div
        class="flight-row"
        style="justify-content:center;color:#888;"
      >

        Loading flights...

      </div>

    </div>


    <div
      id="update-time"
      style="display:none;"
    >
    </div>


  </div>


  <template id="flight-row-template">


    <div class="flight-row">


      <div
        class="col-schedule schedule-time"
      >
      </div>


      <div
        class="col-estimated estimated-time"
      >
      </div>


      <div class="col-destination">

        <div class="dest-main">
        </div>

        <div class="dest-sub">
        </div>

      </div>


      <div
        class="col-flight flight-info-container"
      >


        <div
          class="flight-item main-flight"
        >

          <img
            class="airline-logo"
            src=""
            alt=""
          >

          <div class="flight-number">
          </div>

        </div>


        <div
          class="flight-item codeshare-flight"
          style="display:none;"
        >

          <img
            class="airline-logo"
            src=""
            alt=""
          >

          <div class="flight-number">
          </div>

        </div>


      </div>


      <div
        class="col-aircraft aircraft-code"
      >
      </div>


      <div
        class="col-terminal terminal-text"
      >
      </div>


      <div
        class="col-gate gate-text"
      >
      </div>


    </div>


  </template>


  <script src="renderer.js"></script>

  <script src="patapata.js"></script>


</body>

</html>
